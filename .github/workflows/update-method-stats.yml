
name: Update Lotto Purchase Method Stats

on:
  workflow_dispatch:
  schedule:
    # 매주 일요일 한국 시간 오전 10시
    - cron: "0 1 * * 0"

permissions:
  contents: write

concurrency:
  group: update-method-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip

      - name: Update purchase method statistics
        run: python update_lotto_stats.py

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add method-stats.json
          git diff --cached --quiet || git commit -m "Update lotto purchase method statistics"
          git push
