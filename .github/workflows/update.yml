
name: Update Lotto Data

on:
  schedule:
    # 매주 일요일 한국 시간 오전 3시 20분
    - cron: "20 18 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update winning numbers
        run: python update_lotto.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto.json
          git diff --cached --quiet || git commit -m "Update lotto data"
          git push
